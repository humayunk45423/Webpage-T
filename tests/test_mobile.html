<!DOCTYPE html>
<html lang='en' data-theme='dark'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'>
    <link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Noto+Sans+Bengali:wght@700;800;900&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='../style.css'>
    <style>
        .app-content { padding-top: 75px !important; }
        .hero-section { padding: 20px 14px 16px !important; }
        .hero-layout { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .hero-badges-cluster { order: 1; margin-bottom: 8px !important; }
        .hero-visual-col { order: 2; margin: 6px 0 10px !important; width: 100%; max-width: 260px; }
        .hero-phone-stage { width: 100%; aspect-ratio: 520 / 380; position: relative; }
        .hero-title { order: 3; font-size: 1.65rem !important; margin-bottom: 8px !important; line-height: 1.18 !important; }
        .hero-desc { order: 4; font-size: 0.82rem !important; line-height: 1.4 !important; margin-bottom: 14px !important; }
        .hero-actions { order: 5; margin-bottom: 14px !important; display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .btn-primary, .btn-secondary { padding: 11px 20px !important; font-size: 0.92rem !important; justify-content: center; }
        .hero-stats-row { order: 6; padding-top: 10px !important; gap: 6px !important; }
        .hero-chip { padding: 4px 9px; font-size: 0.68rem; border-radius: 999px; background: rgba(18,20,28,0.85); color: #fff; position: absolute; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; gap: 4px; }
        .chip-1 { top: 0%; left: -4%; }
        .chip-2 { top: 22%; right: -6%; }
        .chip-3 { bottom: 10%; left: -4%; }
        .chip-4 { bottom: -2%; right: -2%; }
    </style>
</head>
<body class='lang-bn'>
    <div class='app-content'>
        <section id='hero' class='hero-section glass-panel'>
            <div class='hero-layout'>
                <div class='hero-badges-cluster'>
                    <div class='hero-badge apple-specialist-badge'>
                        <i class='fa-brands fa-apple'></i> <span>অ্যাপল এক্সপার্ট তানভীর ইকবাল</span>
                    </div>
                </div>
                <div class='hero-visual-col'>
                    <div class='hero-phone-stage'>
                        <div class='hero-chip chip-1'><i class='fa-solid fa-mobile-screen' style='color:#e63946;'></i> <span>ব্যবহৃত ফোন</span></div>
                        <div class='hero-chip chip-2'><i class='fa-solid fa-arrow-right-arrow-left' style='color:#e63946;'></i> <span>এক্সচেঞ্জ</span></div>
                        <div class='hero-chip chip-3'><i class='fa-solid fa-screwdriver-wrench' style='color:#e63946;'></i> <span>রিপেয়ার</span></div>
                        <div class='hero-chip chip-4'><i class='fa-solid fa-shield-halved' style='color:#e63946;'></i> <span>গ্যারান্টি</span></div>
                        <div style='background:#181b24; border-radius:18px; width:100%; height:100%; border:1px solid #333;'></div>
                    </div>
                </div>
                <h1 class='hero-title'>মোবাইল এক্সপ্রেস <br><span class='red-gradient-text'>ক্রয় • বিনিময় • বিক্রয়।</span></h1>
                <p class='hero-desc'>তানভীর ইকবালের বিশ্বস্ত অ্যাপল ও স্মার্টফোন হাব — বদরগঞ্জ, রংপুর</p>
                <div class='hero-actions'>
                    <a href='#' class='btn-primary'><i class='fa-solid fa-mobile-screen'></i> <span>স্মার্টফোন দেখুন (২৪+)</span></a>
                </div>
                <div class='hero-stats-row'>
                    <div class='stat-box'><strong>১০০+</strong><span>ডিভাইস</span></div>
                    <div class='stat-box'><strong>৯৯.৪%</strong><span>সাফল্য</span></div>
                    <div class='stat-box'><strong>১৫ মিনিট</strong><span>সার্ভিস</span></div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
